<style>
/* Layout: early-web homepage. White ground, centered stack of hand-cut "burst" buttons with black outlines, plain Arial type, blue underlined links. Each section is its own view. Single deliberate light look. */
:root{
  --paper:#FFFFFF;
  --ink:#4E0D86;
  --pink:#F4B6D8;
  --blue:#A9D4F2;
  --purple:#C9B0EE;
  --yellow:#F5E77A;
  --green:#9FD3A6;
  --link:#4E0D86;
  --soft:#6A5884;
  --sans:"Plus Jakarta Sans","Helvetica Neue",Arial,sans-serif;
  --display:"Gabarito","Plus Jakarta Sans",Arial,sans-serif;
  --caps:"Russo One","Gabarito",Impact,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.45;letter-spacing:-.01em}
.burst span{font-family:var(--display);font-weight:700;letter-spacing:-.02em}
a{color:var(--link)}
:focus-visible{outline:3px dashed var(--ink);outline-offset:4px}
.page{max-width:820px;margin:0 auto;padding-inline:20px;padding-block:44px 80px}

/* burst */
.burst{position:relative;display:inline-grid;place-items:center;text-decoration:none;color:var(--ink);background:none;border:0;padding:0;cursor:pointer;font-family:var(--sans)}
.burst svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.burst polygon{stroke:var(--ink);stroke-width:3;stroke-linejoin:miter;vector-effect:non-scaling-stroke}
.burst span{position:relative;z-index:1;white-space:nowrap}
.burst:hover span{transform:rotate(-2deg)}
@media (prefers-reduced-motion:no-preference){.burst:active{transform:scale(.97)}}

/* home */
.home{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.home h1{font-family:var(--display);font-weight:800;font-size:clamp(46px,10vw,92px);margin:0;letter-spacing:-.045em;line-height:1;display:flex;align-items:center;gap:.14em}
.home h1 svg{width:.72em;height:.72em;flex:0 0 auto}
.home .tag{margin:8px 0 30px;font-size:18px;font-weight:300}
.stack{display:flex;flex-direction:column;align-items:center;gap:clamp(14px,2.4vw,26px)}
.stack .burst{width:min(400px,84vw);height:clamp(112px,16vw,140px)}
.stack .burst span{font-size:clamp(40px,7vw,58px)}
.home .foot{margin-top:40px;font-size:14px;color:var(--soft)}

/* inner views */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:34px}
.top .back{width:132px;height:62px}
.top .back span{font-size:20px}
.top .me{font-size:16px;color:var(--soft);text-decoration:none}
.top .me:hover{text-decoration:underline}
.title{width:min(460px,100%);height:clamp(110px,18vw,140px);margin-bottom:24px}
.title span{font-size:clamp(38px,7vw,58px)}
.view p{margin:0 0 14px;}
.view h3{font-weight:700;font-size:21px;letter-spacing:-.03em;margin:28px 0 6px}
.view p{font-weight:300}
.view p b{font-weight:700}
.caps{font-family:var(--caps);font-weight:400;text-transform:uppercase;letter-spacing:.01em;line-height:1;margin:0}

/* annotated about */
.anno-title{font-size:clamp(34px,8vw,72px);text-align:center;margin:6px 0 30px}
.anno{display:grid;grid-template-columns:minmax(0,1fr) minmax(200px,280px) minmax(0,1fr);gap:20px 26px;align-items:center;margin-bottom:40px}
.anno .col{display:flex;flex-direction:column;gap:64px;min-width:0}
.note{text-align:center;display:flex;flex-direction:column;gap:4px}
.note .caps{font-size:clamp(22px,3vw,28px)}
.note span{font-size:15px;font-weight:600;line-height:1.3}
.cutout{aspect-ratio:3/5;max-width:100%;border:2px dashed var(--ink);border-radius:120px 120px 24px 24px;display:grid;place-items:center;text-align:center;padding:20px;font-size:15px;font-weight:600}
@media (max-width:640px){
  .anno{grid-template-columns:repeat(2,minmax(0,1fr))}
  .anno .cutout-wrap{grid-column:1 / -1;grid-row:1;justify-self:center;width:min(240px,70vw)}
  .anno .col{gap:24px}
}

.work-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:22px}
.work-list li{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.work-list a{font-size:clamp(26px,4.6vw,36px)}
.work-list .tagb{width:auto;min-width:150px;height:58px;padding:0 26px}
.work-list .tagb span{font-size:15px}
.work-list small{flex-basis:100%;font-size:16px;color:var(--soft)}

.meta{display:flex;flex-wrap:wrap;gap:6px 28px;font-size:15px;color:var(--soft);margin:0 0 20px}
.view ul.pts{margin:0 0 14px;padding-left:1.1em;font-weight:300}
.view ul.pts li{margin:0 0 8px}
.view ul.pts li::marker{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px 28px;margin:0 0 30px}
.stats div{display:flex;flex-direction:column;gap:4px;min-width:0}
.stats b{font-family:var(--display);font-weight:800;font-size:clamp(36px,4.6vw,52px);line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.stats span{font-size:15px;font-weight:400;line-height:1.3}
/* case study layout: scannable, numbers first */
.cs-tldr{font-size:clamp(20px,2.4vw,25px);font-weight:400;line-height:1.38;letter-spacing:-.02em;margin:-12px 0 26px!important}
.lbl{font-family:var(--caps);text-transform:uppercase;font-size:12px;letter-spacing:.05em;margin:0 0 10px!important;font-weight:400}
.sec-lbl{margin-top:4px!important}
.stats{background:var(--tint);border-radius:18px;padding:22px 24px;grid-template-columns:repeat(auto-fit,minmax(128px,1fr))!important;gap:18px 22px!important}
.menu[hidden]{display:none!important}
.pi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:0 0 34px}
.pi>div{padding:20px 22px;border:2px solid var(--ink);border-radius:18px;min-width:0}
.pi p{margin:0!important;font-size:17px;line-height:1.4}
.pi .ins{background:var(--ink);color:var(--paper)}
.pi .ins p:not(.lbl){font-weight:600}
.moves{list-style:none;margin:0 0 36px;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 28px}
.moves li{display:flex;gap:14px;align-items:flex-start;min-width:0}
.moves .n{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--caps);font-size:15px}
.moves div{display:flex;flex-direction:column;gap:3px;min-width:0}
.moves b{font-weight:700;font-size:17px;letter-spacing:-.02em;line-height:1.25}
.moves div span{font-size:15px;font-weight:300;line-height:1.4}
.viz{margin:0 0 36px;padding:24px;border-radius:18px;border:2px dashed var(--ink)}
.flow,.sys{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;padding:7px 13px;border-radius:999px;border:2px solid var(--ink);font-size:14px;font-weight:600;background:var(--paper);line-height:1.2}
.chip.end{background:var(--pink)}
.chip.dim{border-style:dashed;border-color:#B9A6CF;color:var(--soft);font-weight:400}
.chip.on{background:var(--green)}
.arr{font-weight:700}
.note{font-size:14px!important;margin:10px 0 0!important;font-weight:400}
.viz-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;margin-top:26px}
.viz-row>div{min-width:0}
.bar{display:grid;grid-template-columns:6.5em minmax(0,1fr) 3em;align-items:center;gap:10px;margin-bottom:10px;font-size:14px}
.bar .track{height:14px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--paper)}
.bar .fill{display:block;height:100%}
.bar b{font-family:var(--display);font-size:18px;text-align:right;font-variant-numeric:tabular-nums}
.tl{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;padding-top:30px}
.tl .line{flex:1;position:relative;height:2px;background:var(--ink);text-align:center}
.tl .line em{position:absolute;left:50%;top:-30px;transform:translateX(-50%);font-style:normal;font-family:var(--display);font-weight:800;font-size:18px;white-space:nowrap}
.vt{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.vt li{border-top:3px solid var(--ink);padding-top:8px;font-size:14px;font-weight:400}
.vt li:nth-child(3){border-top-color:var(--yellow)}
.vt b{display:block;font-family:var(--caps);font-weight:400;font-size:13px;text-transform:uppercase}
.cov{display:grid;grid-template-columns:8em minmax(0,1fr);gap:12px;align-items:center;margin-bottom:12px}
.cov .bl{font-size:14px;font-weight:600}
.cov-steps{display:flex;flex-wrap:wrap;gap:6px}
.cs-quote{margin:0 0 10px;padding:0;font-family:var(--display);font-weight:800;font-size:clamp(24px,3.2vw,34px);line-height:1.15;letter-spacing:-.035em;max-width:24em;text-shadow:2px 2px 0 var(--paper),4px 4px 0 var(--sh)}
.cs-quote::before{content:"“"}.cs-quote::after{content:"”"}
@media (max-width:640px){
  .pi,.moves,.viz-row{grid-template-columns:1fr}
  .vt{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cov{grid-template-columns:1fr;gap:6px}
  .viz{padding:18px}
}
.wip-tag{display:inline-flex;align-items:center;gap:8px;font-family:var(--caps);text-transform:uppercase;font-size:12px;letter-spacing:.06em;margin:0 0 14px!important}
.wip-tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 1.5px var(--ink)}
.card.wip{border-style:dashed}
.card.wip .swatch{border-bottom-style:dashed}
.big-delta{font-family:var(--display);font-weight:800;font-size:clamp(40px,5vw,56px);line-height:1;letter-spacing:-.04em;text-shadow:2px 2px 0 var(--paper),4px 4px 0 var(--pink)}
.peek{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:zoom-in;font-weight:600;text-decoration:underline dashed;text-decoration-thickness:1.5px;text-underline-offset:3px;position:relative;display:inline;text-align:left}
.peek-pop{position:absolute;left:50%;bottom:calc(100% + 14px);width:240px;padding:6px;background:var(--paper);border-radius:18px;box-shadow:0 18px 40px -12px rgba(40,10,70,.35),0 0 0 1px rgba(78,13,134,.08);display:block;opacity:0;visibility:hidden;transform:translate(-50%,6px) scale(.97);transform-origin:50% 100%;transition:opacity .18s ease,transform .22s cubic-bezier(.2,.8,.2,1),visibility .22s;z-index:20;pointer-events:none;cursor:default;font-weight:400}
.peek-pop::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;margin-left:-6px;background:var(--paper);transform:rotate(45deg);box-shadow:3px 3px 6px -3px rgba(40,10,70,.25)}
.peek-pop img{width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;border-radius:13px;display:block}
.peek-pop span{display:block;padding:8px 6px 4px;font-size:12.5px;font-weight:400;line-height:1.3;text-align:center}
@media (hover:hover){.peek:hover .peek-pop{opacity:1;visibility:visible;transform:translate(-50%,0) scale(1)}}
.peek:focus-visible .peek-pop,.peek.open .peek-pop{opacity:1;visibility:visible;transform:translate(-50%,0) scale(1)}
@media (prefers-reduced-motion:reduce){.peek-pop{transition:none}}
@media (max-width:640px){.peek{position:static}.peek-pop{position:fixed;left:50%;top:50%;bottom:auto;width:min(280px,calc(100vw - 48px));transform:translate(-50%,calc(-50% + 6px)) scale(.97)}.peek-pop::after{display:none}.peek.open .peek-pop,.peek:focus-visible .peek-pop{transform:translate(-50%,-50%) scale(1)}.peek.open::before{content:"";position:fixed;inset:0;background:rgba(30,10,50,.35);z-index:19}}
/* passport: workflow + collapsible features */
.ft-t .ft-kpis{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;font-size:13px;font-weight:400}
.ft-kpis>span{padding:4px 10px;border-radius:999px;background:var(--tint,#fde3ef);border:1.5px solid var(--ink)}
.ft-kpis b{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:-.02em}
.dpp2{margin:18px 0 4px;display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.ft-body .dpp2 img{width:200px}
.dpp2 img{width:230px;max-width:70%;height:auto;border:2px solid var(--ink);border-radius:28px;box-shadow:6px 6px 0 var(--pink);display:block}
.dpp2 figcaption{flex:1 1 180px;font-size:14px;font-weight:300;line-height:1.4;display:flex;flex-direction:column;gap:6px;max-width:260px}
.wf{list-style:none;margin:0 0 36px;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;position:relative}
.wf li{display:flex;flex-direction:column;gap:6px;min-width:0;position:relative;padding-top:4px}
.wf li:not(:last-child)::after{content:"";position:absolute;top:21px;left:46px;right:-10px;height:2px;background:var(--ink)}
.wf .n{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--caps);font-size:15px;position:relative;z-index:1}
.wf b{font-weight:700;font-size:16px;letter-spacing:-.02em;line-height:1.2;margin-top:6px}
.wf li>span:not(.n){font-size:15px;font-weight:300;line-height:1.4}
.wf b{font-family:var(--display);font-size:20px}
.wf .mine{font-style:normal;font-size:12px;font-weight:500;line-height:1.3;align-self:flex-start;margin-top:4px;padding:4px 9px;border-radius:999px;background:var(--tint,#fde3ef);border:1.5px solid var(--ink)}
.feats{display:flex;flex-direction:column;gap:12px;margin:0 0 36px}
.feat{border:2px solid var(--ink);border-radius:18px;background:var(--paper)}
.feat summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:16px 20px}
.feat summary::-webkit-details-marker{display:none}
.feat summary:focus-visible{outline:3px dashed var(--ink);outline-offset:3px;border-radius:16px}
.ft-t{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.ft-t b{font-family:var(--display);font-weight:800;font-size:clamp(19px,2vw,22px);letter-spacing:-.03em;line-height:1.15}
.ft-t span{font-size:15px;font-weight:300}
.ft-tag{flex:0 0 auto;font-family:var(--caps);text-transform:uppercase;font-size:11px;letter-spacing:.05em;padding:5px 10px;border-radius:999px;border:2px solid var(--ink)}
.ft-x{flex:0 0 auto;width:26px;height:26px;position:relative}
.ft-x::before,.ft-x::after{content:"";position:absolute;left:5px;right:5px;top:50%;height:2.5px;margin-top:-1px;background:var(--ink);transition:transform .25s ease}
.ft-x::after{transform:rotate(90deg)}
.feat[open] .ft-x::after{transform:rotate(0deg)}
.ft-body{padding:0 20px 20px}
.ft-body ul.pts{margin-bottom:0}
.feats mark.kp{color:inherit;font-weight:600;background:linear-gradient(transparent 48%,var(--kc) 48%,var(--kc) 92%,transparent 92%);padding:0 .06em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.steps-viz{margin:6px 0 18px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);align-items:start;gap:10px}
.sv{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;min-width:0}
.sv img{width:100%;max-width:190px;height:auto;border:2px solid var(--ink);border-radius:18px;background:#fff;box-shadow:5px 5px 0 var(--pink)}
.sv-n{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--caps);font-size:13px;margin-top:8px}
.sv b{font-weight:700;font-size:15px;letter-spacing:-.02em}
.sv>span:last-child{font-size:13px;font-weight:300;line-height:1.35;max-width:16em}
.sv-arr{font-weight:800;font-size:22px;align-self:center;margin-top:-60px}
@media (min-width:641px){.steps-viz.n4{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);gap:8px}}
@media (max-width:640px){.steps-viz{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.steps-viz.n4{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.sv-arr{display:none}.sv img{border-radius:10px;box-shadow:3px 3px 0 var(--pink)}.sv>span:last-child{display:none}}
.fb{padding:16px 0;border-top:2px dashed #CDB9E6}
.fb:first-child{border-top:0;padding-top:4px}
.fb .lbl{margin-bottom:8px!important}
.fb-p{margin:0!important;font-weight:300}
.fb ul.pts{margin-bottom:0}
.fb .fviz{margin-top:14px;padding-top:0;border-top:0}
.fb .steps-viz{margin-top:16px}
.ft-logo{display:inline-block;width:auto;vertical-align:-.08em;margin-left:.15em}
.ft-logo.pm{height:.78em}
.ft-logo.dp{height:.95em;vertical-align:-.22em}
.who{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.who div{border:2px solid var(--ink);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.who div:nth-child(4){background:var(--pink)}
.who b{font-size:14px;font-weight:700}
.who span{font-size:13px;font-weight:300;line-height:1.3}
@media (max-width:640px){.who{grid-template-columns:repeat(2,minmax(0,1fr))}}
.next-lbl{margin-top:22px!important}
@media (max-width:640px){
  .feat{border-radius:16px}
  .feat summary{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;align-items:start;padding:14px 16px}
  .ft-t{grid-column:1;grid-row:1}
  .ft-x{grid-column:2;grid-row:1;margin-top:2px}
  .ft-tag{grid-column:1;grid-row:2;justify-self:start}
  .ft-t b{font-size:19px}
  .ft-t span{font-size:14px}
  .ft-body{padding:0 16px 16px}
  .feats .fb-p,.feats ul.pts{font-size:16px;line-height:1.45}
  .feats ul.pts{padding-left:1em}
  .feats mark.kp{font-weight:500}
  .fb{padding:14px 0}
  .who{grid-template-columns:1fr;gap:6px}
  .who div{flex-direction:row;align-items:baseline;gap:10px;padding:8px 12px;border-radius:12px}
  .who b{flex:0 0 7.2em}
  .media-ph{min-height:80px}
}
@media (max-width:640px){
  .stats{grid-template-columns:1fr!important;gap:0!important;padding:6px 18px!important}
  .stats div{flex-direction:row!important;align-items:center;gap:14px!important;padding:12px 0;border-top:2px dashed rgba(78,13,134,.25)}
  .stats div:first-child{border-top:0}
  .stats b{font-size:32px!important;min-width:3.3em;flex:0 0 auto}
  .stats span{font-size:14px!important}
}
/* problem → what we built */
.ps2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:14px;margin:6px 0 34px;align-items:stretch}
.ps2-q{padding:20px 22px;background:#F3EEF8;border-radius:18px}

  // seeded random
  function rng(seed){var s=0;for(var i=0;i<seed.length;i++)s=(s*31+seed.charCodeAt(i))>>>0;return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296}}
  // jagged polygon around a rectangle in a W x H box
  function points(W,H,seed){
    var r=rng(seed),m=Math.min(W,H)*0.16,x0=m,y0=m,x1=W-m,y1=H-m;
    var w=x1-x0,h=y1-y0,per=2*(w+h),n=Math.max(18,Math.round(per/(W*0.07))),pts=[];
    for(var i=0;i<n;i++){
      var d=(i+r()*0.5)/n*per,x,y,nx,ny;
      if(d<w){x=x0+d;y=y0;nx=0;ny=-1}
      else if(d<w+h){x=x1;y=y0+(d-w);nx=1;ny=0}
      else if(d<2*w+h){x=x1-(d-w-h);y=y1;nx=0;ny=1}
      else{x=x0;y=y1-(d-2*w-h);nx=-1;ny=0}
      var spike=i%2===0?m*(0.25+r()*0.85):-m*r()*0.35;
      if(r()<0.12&&i%2===0)spike*=1.6;
      pts.push((x+nx*spike+(r()-.5)*m*.4).toFixed(1)+','+(y+ny*spike+(r()-.5)*m*.4).toFixed(1));
    }
    return pts.join(' ');
  }

  // small diagrams that sit inside each case study

  function route(){
    var id=(location.hash||'').slice(1);
    var pi=-1;for(var i=0;i<P.length;i++)if(P[i].id===id)pi=i;
    var views={work:1,about:1,writing:1,elsewhere:1,contact:1};
    app.innerHTML=pi>=0?V.project(pi):(views[id]?V[id]():V.home());
    app.className='page'+((pi<0&&!views[id])?' wide':'');
    setMenu(false);
    window.scrollTo(0,0);
    requestAnimationFrame(drawAll);
    heroState();
  }
  function heroState(){document.body.classList.toggle('at-hero',!!document.querySelector('.hero-wm')&&window.scrollY<260)}
  window.addEventListener('scroll',heroState,{passive:true});

  // faint sparkle trail behind the cursor (mouse and trackpad only)
  (function(){
    if(!window.matchMedia||!matchMedia('(hover:hover) and (pointer:fine)').matches||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    var cvs=document.createElement('canvas');cvs.setAttribute('aria-hidden','true');
    cvs.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50';
    document.body.appendChild(cvs);
    var ctx=cvs.getContext('2d'),dpr=1,parts=[],running=false,lx=null,ly=null;
    var cols=['#F4B6D8','#A9D4F2','#C9B0EE','#F5E77A','#9FD3A6'];
    function size(){dpr=Math.min(window.devicePixelRatio||1,2);cvs.width=innerWidth*dpr;cvs.height=innerHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
    size();window.addEventListener('resize',size);
    // four-point sparkle: pastel fill, faint violet outline
    function draw4(p,a){
      var r=p.r,k=r*.22;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.beginPath();ctx.moveTo(0,-r);ctx.quadraticCurveTo(k,-k,r,0);ctx.quadraticCurveTo(k,k,0,r);ctx.quadraticCurveTo(-k,k,-r,0);ctx.quadraticCurveTo(-k,-k,0,-r);ctx.closePath();
      ctx.globalAlpha=a*.85;ctx.fillStyle=p.c;ctx.fill();
      ctx.globalAlpha=a*.35;ctx.lineWidth=1;ctx.strokeStyle='#4E0D86';ctx.stroke();ctx.restore();
    }
    function tick(t){
      ctx.clearRect(0,0,innerWidth,innerHeight);
      var now=performance.now();
      parts=parts.filter(function(p){return now-p.t<p.life});
      parts.forEach(function(p){
        var k=(now-p.t)/p.life;
        p.x+=p.vx;p.y+=p.vy;p.vy+=.012;p.rot+=p.spin;
        draw4({x:p.x,y:p.y,r:p.r*(1-k*.5),rot:p.rot,c:p.c},1-k);
      });
      if(parts.length)requestAnimationFrame(tick);else running=false;
    }
    window.addEventListener('pointermove',function(e){
      if(e.pointerType&&e.pointerType!=='mouse')return;
      var x=e.clientX,y=e.clientY;
      if(lx!==null&&Math.hypot(x-lx,y-ly)<16)return;
      lx=x;ly=y;
      if(parts.length>40)parts.shift();
      parts.push({x:x+(Math.random()-.5)*10,y:y+(Math.random()-.5)*10,vx:(Math.random()-.5)*.5,vy:Math.random()*.3+.1,r:3+Math.random()*5,rot:Math.random()*Math.PI,spin:(Math.random()-.5)*.04,c:cols[Math.floor(Math.random()*cols.length)],t:performance.now(),life:700+Math.random()*500});
      if(!running){running=true;requestAnimationFrame(tick)}
    },{passive:true});
  })();

  // tap to show the tag photo (phones), tap anywhere else to close
  document.addEventListener('click',function(e){
    var pk=e.target.closest('.peek');
    document.querySelectorAll('.peek.open').forEach(function(o){if(o!==pk){o.classList.remove('open');o.setAttribute('aria-expanded','false')}});
    if(pk){var on=!pk.classList.contains('open');pk.classList.toggle('open',on);pk.setAttribute('aria-expanded',String(on))}
  });

  // impact numbers count up the first time they scroll into view
  function countUp(el){
    if(el.dataset.done)return;el.dataset.done=1;
    var m=(el.dataset.v||'').match(/^([^\d]*)(\d+)(.*)$/);if(!m)return;
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    var end=+m[2],t0=null,dur=1100;
    function f(t){if(!t0)t0=t;var k=Math.min(1,(t-t0)/dur);k=1-Math.pow(1-k,3);el.textContent=m[1]+Math.round(end*k)+m[3];if(k<1)requestAnimationFrame(f)}
    requestAnimationFrame(f);
  }
  var cntIO='IntersectionObserver' in window?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){countUp(e.target);cntIO.unobserve(e.target)}})},{threshold:.6}):null;
  function watchCounts(){if(!cntIO)return;document.querySelectorAll('.cnt:not([data-done])').forEach(function(el){cntIO.observe(el)})}
  document.addEventListener('toggle',function(){watchCounts()},true);
  new MutationObserver(watchCounts).observe(document.body,{childList:true,subtree:true});
  watchCounts();
  // mobile lifecycle: dashed loop from Next life back to Owned
  function placeLoops(){
    document.querySelectorAll('.cs-cover-scroll.wide:not([data-c])').forEach(function(w){var im=w.querySelector('img');function c(){if(w.scrollWidth>w.clientWidth){w.scrollLeft=(w.scrollWidth-w.clientWidth)/2;w.setAttribute('data-c','1')}}if(im&&!im.complete)im.addEventListener('load',c,{once:true});else c();});
    document.querySelectorAll('.jr').forEach(function(j){
      var m=j.querySelector('.jr-mloop'),li=j.querySelectorAll('.jr-n');if(!m||li.length<4)return;
      var r=j.getBoundingClientRect(),a=li[1].querySelector('.jr-dot').getBoundingClientRect(),b=li[3].querySelector('.jr-dot').getBoundingClientRect();
      var y1=a.top+a.height/2-r.top,y2=b.top+b.height/2-r.top;
      m.style.top=y1+'px';m.style.height=(y2-y1)+'px';m.style.width=(a.left-r.left-4-2)+'px';
    });
  }
  window.addEventListener('resize',placeLoops);
  new MutationObserver(function(){requestAnimationFrame(placeLoops)}).observe(document.body,{childList:true,subtree:true});
  setTimeout(placeLoops,50);
  // drag the hero stickers around
  document.addEventListener('pointerdown',function(e){
    var st=e.target.closest('.st');if(!st)return;
    e.preventDefault();
    var sx=e.clientX,sy=e.clientY,dx=parseFloat(st.dataset.dx||0),dy=parseFloat(st.dataset.dy||0),nx=dx,ny=dy;
    st.classList.add('dragging');try{st.setPointerCapture(e.pointerId)}catch(_){}
    function mv(ev){nx=dx+ev.clientX-sx;ny=dy+ev.clientY-sy;st.style.setProperty('--dx',nx+'px');st.style.setProperty('--dy',ny+'px')}
    function up(){st.classList.remove('dragging');st.dataset.dx=nx;st.dataset.dy=ny;st.removeEventListener('pointermove',mv);st.removeEventListener('pointerup',up);st.removeEventListener('pointercancel',up)}
    st.addEventListener('pointermove',mv);st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
  });

  // cards tilt toward the cursor
  if(false){
    document.addEventListener('pointermove',function(e){
      var s=e.target.closest&&e.target.closest('.card .swatch');if(!s)return;
      var r=s.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
      s.style.transform='perspective(1000px) rotateX('+(-y*6).toFixed(2)+'deg) rotateY('+(x*8).toFixed(2)+'deg) translateY(-4px)';
    });
    document.addEventListener('pointerout',function(e){
      var s=e.target.closest&&e.target.closest('.card .swatch');if(s&&!s.contains(e.relatedTarget))s.style.transform='';
    });
  }
  var menu=document.getElementById('menu');
  document.getElementById('menuStack').innerHTML=V.menuStack();
  function setMenu(o){
    menu.hidden=!o;document.body.style.overflow=o?'hidden':'';
    if(o){requestAnimationFrame(drawAll);document.getElementById('menuClose').focus()}
  }
  document.getElementById('hamBtn').addEventListener('click',function(){setMenu(true)});
  document.getElementById('menuClose').addEventListener('click',function(){setMenu(false);document.getElementById('hamBtn').focus()});
  menu.addEventListener('click',function(e){if(e.target.closest('a'))setMenu(false)});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!menu.hidden)setMenu(false)});
  // tuck the header away while scrolling down, bring it back on any scroll up
  var hdr=document.querySelector('.hdr'),lastY=window.scrollY,ticking=false;
  window.addEventListener('scroll',function(){
    if(ticking)return;ticking=true;
    requestAnimationFrame(function(){
      var y=window.scrollY;
      if(y>lastY+4&&y>140)hdr.classList.add('away');
      else if(y<lastY-4||y<=140)hdr.classList.remove('away');
      lastY=y;ticking=false;
    });
  },{passive:true});
  hdr.addEventListener('focusin',function(){hdr.classList.remove('away')});
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function scrollToId(id){
    var go=function(){var t=document.getElementById(id);if(t)t.scrollIntoView({behavior:reduce?'auto':'smooth'})};
    if(!document.getElementById(id)){history.replaceState(null,'',location.pathname+location.search);route();requestAnimationFrame(function(){requestAnimationFrame(go)})}
    else go();
  }
  document.addEventListener('click',function(e){var b=e.target.closest('[data-scroll]');if(b){e.preventDefault();scrollToId(b.getAttribute('data-scroll'))}});
  document.addEventListener('keydown',function(e){var b=e.target.closest&&e.target.closest('[data-scroll][role="button"]');if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();scrollToId(b.getAttribute('data-scroll'))}});
  document.querySelector('.hdr').addEventListener('mouseover',function(e){var b=e.target.closest('.burst');if(b&&!b.contains(e.relatedTarget))draw(b,String(Math.random()))});
  menu.addEventListener('mouseover',function(e){var b=e.target.closest('.burst');if(b&&!b.contains(e.relatedTarget))draw(b,String(Math.random()))});
  window.addEventListener('hashchange',route);
  window.addEventListener('resize',function(){clearTimeout(window.__rt);window.__rt=setTimeout(drawAll,120)});
  // re-cut the burst on hover
  app.addEventListener('mouseover',function(e){var b=e.target.closest('a.burst');if(b&&!b.contains(e.relatedTarget))draw(b,String(Math.random()))});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawAll);
  route();
})();
</script>
<script>
/* Resume: inside claude.ai the page is sandboxed, so hand the PDF over through the downloads capability; on a normal domain the plain link works. */
(function(){
  var dl=null;
  try{ if(window.claude&&window.claude.use){ window.claude.use("downloads").then(function(d){dl=d}).catch(function(){}); } }catch(e){}
  document.addEventListener("click",function(e){
    var a=e.target.closest&&e.target.closest("a.resume-dl");
    if(!a||!dl)return;
    e.preventDefault();
    fetch(a.getAttribute("href")).then(function(r){if(!r.ok)throw 0;return r.blob()})
      .then(function(b){return dl.save({filename:"Thea-Posey-Resume.pdf",data:b})})
      .catch(function(err){ if(err&&err.code==="declined")return; });
  });
})();
</script>
